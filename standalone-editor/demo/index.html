<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Standalone Editor Demo</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0d12; color: #e9ecf2; font: 16px system-ui, sans-serif; }
  #game { position: relative; width: 100%; height: 100%; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  .bar { position: absolute; left: 1em; top: 1em; display: flex; gap: 0.5em; align-items: center; }
  .bar button { font: inherit; padding: 0.4em 0.9em; border-radius: 0.5em; border: 1px solid #444; background: #1b2130; color: inherit; }
  .bar span { color: #9aa3b5; }
</style>
</head>
<body>
<div id="game">
  <canvas id="c"></canvas>
  <div class="bar"><button id="feel">Game Feel</button><button id="tools">Workshop</button><span>Start / F1 opens the Workshop. A pad or the arrow keys move.</span></div>
</div>
<script type="module" src="./demo.ts"></script>
</body>
</html>
