<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RATQUEST: THE KINGDOM BELOW</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b0d0a; overflow: hidden; }
      body { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
      #gameWrap { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
      body.has-pad #gameWrap { width: auto; height: auto; }
      canvas#game { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
      #debug {
        position: absolute; top: 34px; left: 8px; color: #cfe8c0;
        font: 10px/1.3 monospace; background: rgba(0,0,0,0.35); padding: 2px 6px;
        white-space: pre; pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="gameWrap">
      <canvas id="game"></canvas>
      <div id="debug"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
